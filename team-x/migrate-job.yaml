apiVersion: batch/v1
kind: Job
metadata:
  name: team-x-migrate
  namespace: team-x
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    metadata:
      name: team-x-migrate
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: alpine:3.20
          command: ["sleep", "3"]
