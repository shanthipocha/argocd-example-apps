apiVersion: batch/v1
kind: Job
metadata:
  name: waves-verify
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: verify
          image: alpine:3.20
          command: ["sleep"]
          args: ["2"]
